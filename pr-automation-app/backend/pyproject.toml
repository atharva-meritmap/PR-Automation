[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-automation-backend"
version = "0.1.0"
description = "Multi-tenant PR Automation platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.14.0,<2.0",
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "email-validator>=2.2.0,<3.0",
    "PyJWT>=2.10.0,<3.0",
    "pwdlib[argon2]>=0.2.1,<1.0",
    "redis>=5.2.0,<6.0",
    "structlog>=24.4.0,<26.0",
    "python-dotenv>=1.0.1,<2.0",
    "scrapling>=0.5.0,<1.0",
    "protego>=0.3.0,<1.0",
    "feedparser>=6.0.11,<7.0",
    "celery>=5.4.0,<6.0",
    "dnspython>=2.7.0,<3.0",
    "httpx>=0.28.0,<1.0",
]

[project.optional-dependencies]
ml = [
    "laya>=0.4.31,<1.0",
]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "httpx>=0.28.0,<1.0",
    "aiosqlite>=0.20.0,<1.0",
    "ruff>=0.8.0,<1.0",
    "mypy>=1.13.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

